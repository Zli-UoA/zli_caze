name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "account_id_length=${#CLOUDFLARE_ACCOUNT_ID}"
          echo "token_length=${#CLOUDFLARE_API_TOKEN}"
          CF_BIN=$(find node_modules/.pnpm -path '*/cf/bin/cf' -print -quit)
          echo "cf_bin=$CF_BIN"
          echo "--- cf auth whoami ---"
          node "$CF_BIN" auth whoami
          echo "--- cf workers deployments list ---"
          node "$CF_BIN" workers deployments list --worker zli-caze
          echo "--- API deployments ---"
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zli-caze/deployments"
          echo "--- API scripts ---"
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          echo "--- .void contents ---"
          ls -la .void
          echo "--- link file ---"
          cat .void/cloudflare-link.json 2>&1
      - name: Deploy
        env:
          # Settings -> Secrets and variables -> Actions
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Needed when the token can access multiple accounts.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # Required only when Cloudflare Access protects Worker readiness.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec void deploy --platform cloudflare --debug
